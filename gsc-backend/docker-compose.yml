# DEVELOPMENT compose. Production is docker-compose.prod.yml.
#
#   dev:   docker compose up
#   prod:  docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build:
      context: .
      # Explicit: without it, `build: .` uses the Dockerfile's LAST stage, which
      # is the production runtime image — so `docker compose up` would run
      # `node dist/index.js` over the bind-mounted source below instead of a
      # hot-reloading dev server.
      target: dev
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind mount source for hot reload (nodemon) — container's node_modules
      # stays in its own volume so your host OS's node_modules never overwrites it.
      - .:/app
      - node_modules:/app/node_modules

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsc}
      POSTGRES_DB: ${POSTGRES_DB:-gsc_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gsc} -d ${POSTGRES_DB:-gsc_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --maxmemory 256mb: a cache must never grow until it starves the machine.
    # --maxmemory-policy allkeys-lru: when full, evict the least recently used
    #   key rather than refusing writes. That is the correct policy for a pure
    #   cache — losing a cold entry is free, since it can always be recomputed
    #   from Postgres. (For a job queue you would NOT want this, because evicting
    #   a queued job silently loses work.)
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      # Bound to localhost only. Redis has no authentication enabled here, so it
      # must never be reachable from outside this machine.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  node_modules:
